name: Monthly activity

# Keeps the repo active so GitHub does not disable scheduled workflows
# after 60 days without repository activity.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump timestamp
        run: |
          date -u > .last-activity
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .last-activity
          git commit -m "chore: monthly activity $(date -u +%F)" || exit 0
          git push
